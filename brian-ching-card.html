<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brian Ching</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600&family=DM+Sans:wght@300;400;500&family=Cormorant+Garamond:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f2ede8;
      --card: #faf7f4;
      --dark: #1a1612;
      --mid: #4a403a;
      --accent: #8b6f47;
      --accent-light: #c4a882;
      --border: rgba(139,111,71,0.2);
      --muted: #9a8a7a;
    }
    html, body {
      min-height: 100%;
      font-family: 'DM Sans', sans-serif;
      color: var(--dark);
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100svh;
      padding: 24px 16px;
      background:
        radial-gradient(ellipse 70% 50% at 20% 20%, #e8ddd4 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 80%, #ddd0c4 0%, transparent 60%),
        var(--bg);
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(90,60,30,0.12), 0 2px 8px rgba(90,60,30,0.06);
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 0.7s cubic-bezier(0.22,1,0.36,1) 0.1s forwards;
    }
    @keyframes fadeUp { to { opacity:1; transform:translateY(0); } }
    .card::before {
      content: '';
      display: block;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
    }
    .photo-wrap {
      position: relative;
      width: 100%;
      height: 340px;
      overflow: hidden;
    }
    .photo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
      transform: scale(0.85);
      transform-origin: center center;
    }
    .photo-wrap::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent 45%, var(--card) 100%);
    }
    .body { padding: 0 28px 28px; }
    .name-block { margin-bottom: 20px; }
    .name-row {
      display: flex;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
    }
    .name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2rem;
      font-weight: 600;
      line-height: 1.1;
      color: var(--dark);
    }
    .chinese-name {
      font-family: 'Noto Serif TC', serif;
      font-size: 1.1rem;
      font-weight: 300;
      color: var(--accent);
      letter-spacing: 0.08em;
    }
    .title-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 7px;
      flex-wrap: wrap;
    }
    .title-en {
      font-size: 0.75rem;
      font-weight: 400;
      color: var(--muted);
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    .title-sep {
      width: 1px;
      height: 12px;
      background: var(--border);
    }
    .title-zh {
      font-family: 'Noto Serif TC', serif;
      font-size: 0.75rem;
      font-weight: 300;
      color: var(--muted);
      letter-spacing: 0.1em;
    }
    .divider {
      width: 40px;
      height: 1px;
      background: linear-gradient(90deg, var(--accent), transparent);
      margin: 20px 0;
    }
    .contacts {
      display: flex;
      flex-direction: column;
      gap: 13px;
      margin-bottom: 28px;
    }
    .contact-row {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--dark);
      transition: color 0.2s;
    }
    .contact-row:hover { color: var(--accent); }
    .icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(139,111,71,0.08);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s;
    }
    .contact-row:hover .icon { background: rgba(139,111,71,0.14); }
    .icon svg { width: 16px; height: 16px; fill: var(--accent); }
    .contact-text {
      font-size: 0.875rem;
      font-weight: 300;
      color: var(--mid);
      letter-spacing: 0.02em;
    }
    .contact-row:hover .contact-text { color: var(--accent); }
    .socials { display: flex; gap: 10px; margin-bottom: 28px; }
    .social-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: transparent;
      text-decoration: none;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      transition: all 0.2s;
    }
    .social-btn:hover {
      color: var(--accent);
      border-color: var(--accent-light);
      background: rgba(139,111,71,0.06);
    }
    .social-btn svg { width: 15px; height: 15px; fill: currentColor; }


    .services {{ margin-bottom: 22px; }}
    .services-list {{ display: flex; flex-direction: column; gap: 8px; }}
    .service-row {{
      display: flex;
      align-items: center;
      gap: 12px;
    }}
    .service-zh {{
      font-family: 'Noto Serif TC', serif;
      font-size: 0.82rem;
      font-weight: 400;
      color: var(--accent);
      letter-spacing: 0.06em;
      min-width: 56px;
    }}
    .service-en {{
      font-size: 0.82rem;
      font-weight: 300;
      color: var(--mid);
      letter-spacing: 0.03em;
    }}
    .languages {{ margin-bottom: 22px; }}
    .lang-label {{
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }}
    .lang-tags {{
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }}
    .lang-tag {{
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 5px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: rgba(139,111,71,0.05);
      font-size: 0.78rem;
      font-weight: 400;
      color: var(--mid);
      letter-spacing: 0.03em;
    }}
    .lang-zh {{
      font-family: 'Noto Serif TC', serif;
      font-size: 0.78rem;
      color: var(--accent);
    }}
    .save-btn {
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, var(--accent) 0%, #6b4f2e 100%);
      color: #faf7f4;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
      box-shadow: 0 4px 20px rgba(139,111,71,0.25);
    }
    .save-btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .save-btn:active { transform: translateY(0); }
  </style>
</head>
